          - paragraph:
            - strong:
              - generic:
                - strong
          - paragraph [ref=f1e115]:
            - generic [ref=f1e116]: 余氯或其它氧化剂会损害膜的性能，但是许多膜制造商为了让膜元件初始性能表现出色，在出厂前用活性氯处理了膜元件，获得了短期的性能提升，但却带来了长期的性能快速下降。经氯化处理过的膜元件会带来许多长期缺陷：比如膜寿命会大大缩短，对高pH清洗条件会高度敏感，脱盐率会随时间快速衰减，对铵、硝酸盐、硼、硅、砷酸盐等难脱除的“软离子”及低分子量有机物会表现出更低的脱除率，运行过程中，膜会对水中的氧化性氯极其敏感等。
          - paragraph [ref=f1e117]
