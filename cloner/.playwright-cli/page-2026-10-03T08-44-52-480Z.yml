        - generic [ref=e162]:
          - list:
            - listitem [ref=e163]:
              - heading [level=3] [ref=e164]:
                - link "苏瑞膜邀您共赴第27届上海国际环博会，共探膜技术芯未来!" [ref=e165] [cursor=pointer]:
                  - /url: /news_detail?id=49
              - paragraph [ref=e166]: 上海环博会(IE expo Shanghai)将于2026年4月13-15日在上海新国际博览中心再度举办。本次展会，苏瑞膜将首发2026全新系列产品：ZCon零排系列与TOC中性分子高去除系列膜，以及反渗透/纳滤全系列、特种分离渗透膜、碟管式膜组件等全品类产品国产解决方案。
            - listitem [ref=e167]:
              - heading [level=3] [ref=e168]:
                - link "苏瑞膜入选2024年度自然资源标准制修订计划单位" [ref=e169] [cursor=pointer]:
                  - /url: /news_detail?id=48
              - paragraph [ref=e170]: 苏州苏瑞膜纳米科技有限公司在《2024年度自然资源标准制修订工作计划》中脱颖而出，成功入选。这一成就不仅体现了公司在膜技术领域的卓越实力，更标志着苏瑞膜在推动自然资源高效利用和保护方面的重要贡献。
            - listitem [ref=e171]:
              - heading [level=3] [ref=e172]:
                - link "苏瑞膜应邀参加AIM2024全球顶级投资盛会" [ref=e173] [cursor=pointer]:
                  - /url: /news_detail?id=47
              - paragraph [ref=e174]: 第十三届AIM投资峰会于2024年5月9日阿联酋阿布扎比完美谢幕。苏瑞膜在硅港资本的邀请及支持下参加本次峰会，苏瑞膜研发总监李成永博士在5月9日的AIM企业家投资峰会—中小企业专场分论坛中围绕"蓝色经济：可持续经济的新浪潮"的会议议题发表主题演讲，展示了苏瑞膜的企业理念、产品技术、应用场景及解决方案
          - link "更多新闻详情" [ref=e176] [cursor=pointer]:
