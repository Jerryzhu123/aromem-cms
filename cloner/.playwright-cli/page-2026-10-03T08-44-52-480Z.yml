      - paragraph [ref=e119]: 苏州苏瑞膜纳米科技集团有限公司成立于2016年，是由美国、新加坡等地世界 500 强企业从事研发与管理工作十余年的海归团队创办的高科技企业，主要从事属于国家战略新兴产业的水分离核心材料"复合反渗透与纳滤膜"的研发、生产、销售与服务。 公司始终坚持"将一片分离膜做到极致"的专注精神、快速迭代的精益制造原则，不断自主创新，做出品质一流的产品。
