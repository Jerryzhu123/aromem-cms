name: build-web

# 前台（surmem-web）云构建：本机 DLP 会挡子进程读桌面文件、生产机只有 1.6G 内存，
# 两端都不适合跑 Next 构建，统一放 GitHub 跑。
#
# 2026-10-21 起形态变更：前台从「纯静态导出」改为「预渲染 + 按需再生成」，
# 产物不再是 out/ 静态目录，而是 standalone 运行目录（server.js + .next + public）。
# 页面仍在构建期全部预渲染，但缓存可被后台吊销，改数据不必重新走一遍构建部署。
#
# 产物打成 tar.gz 推到 web-out 分支（force push，只留最新一次），日志推 ci-status-web。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/build-web.yml"

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      LOG: /tmp/web-build.log
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 构建机连不到服务器内网，取数必须走公网域名
      POOL_API_BASE: "https://www.surmem.com"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: web
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile --reporter=append-only 2>&1 | tee -a "$LOG"

      - name: 构建
        working-directory: web
        run: |
          set -o pipefail
          NODE_OPTIONS=--max-old-space-size=4096 pnpm run build 2>&1 | tee -a "$LOG"

      - name: 组装运行目录
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/web"
          test -f .next/standalone/server.js || { echo "standalone 产物缺失：检查 next.config 的 output"; exit 1; }
          test -d .next/static || { echo ".next/static 缺失：静态资源不会加载"; exit 1; }
          test -d public || { echo "public 缺失：图片会全部 404"; exit 1; }

          ROOT="$RUNNER_TEMP/node-dist"
          rm -rf "$ROOT" && mkdir -p "$ROOT"

          # standalone 自带 server.js 与精简 node_modules，但不含 static 与 public，需手工补
          cp -r .next/standalone/. "$ROOT/"
          mkdir -p "$ROOT/.next/static"
          cp -r .next/static/. "$ROOT/.next/static/"
          cp -r public "$ROOT/public"

          # 泳池产品图体量大且内容稳定，不进产物；部署时由服务器从在用目录硬链接继承
          rm -rf "$ROOT/public/products/pool"

          PAGES=$(find "$ROOT/.next/server/app" -name '*.html' | wc -l)
          echo "预渲染页面：$PAGES 个"
          test "$PAGES" -ge 1000 || { echo "预渲染页面仅 $PAGES 个，低于预期（应 1160 上下）"; exit 1; }

          tar -czf "$RUNNER_TEMP/surmem-web-node.tar.gz" -C "$ROOT" .
          ls -lh "$RUNNER_TEMP/surmem-web-node.tar.gz"

          # GitHub 单文件上限 100MB，产物包约 110MB 会被拒绝推送，
          # 按 90MB 分卷，部署时 cat 拼回
          cd "$RUNNER_TEMP"
          split -b 90m -d -a 2 surmem-web-node.tar.gz surmem-web-node.tar.gz.part-
          ls -lh surmem-web-node.tar.gz.part-*

      - name: 发布产物到 web-out 分支
        run: |
          set -e
          test -f "$RUNNER_TEMP/surmem-web-node.tar.gz.part-00" || { echo "产物分卷不存在"; exit 1; }
          mkdir -p "$RUNNER_TEMP/publish" && cd "$RUNNER_TEMP/publish"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$RUNNER_TEMP"/surmem-web-node.tar.gz.part-* .
          printf 'source commit: %s\nbuilt at: %s\n形态: standalone（预渲染 + 按需再生成）\n泳池图: 已剔除，部署时由服务器硬链接\n分卷: 每卷 90MB，部署前用 cat 拼回 surmem-web-node.tar.gz\n' \
            "$GITHUB_SHA" "$(date -u +%FT%TZ)" > BUILD_INFO.txt
          git add -A
          git commit -q -m "web-out from ${GITHUB_SHA:0:7}"
          git branch -M web-out
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin web-out

      - name: 回传日志（成功失败都执行）
        if: always()
        run: |
          mkdir -p /tmp/st-web && cd /tmp/st-web
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "job status: ${{ job.status }}";
            echo "commit: $GITHUB_SHA";
            echo "形态: standalone（预渲染 + 按需再生成）";
            ls -lh "$RUNNER_TEMP/surmem-web-node.tar.gz" 2>/dev/null || echo "产物包不存在";
            ls -d "$RUNNER_TEMP/node-dist/.next/server/app/products/pool" 2>/dev/null && \
              echo "pool html: $(find "$RUNNER_TEMP/node-dist/.next/server/app/products/pool" -maxdepth 1 -name '*.html' | wc -l)";
          } > STATUS.txt
          if [ -f "$LOG" ]; then cp "$LOG" build.log; else echo "(无日志)" > build.log; fi
          git add -A
          git commit -q -m "status ${{ job.status }}" || true
          git branch -M ci-status-web
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin ci-status-web
